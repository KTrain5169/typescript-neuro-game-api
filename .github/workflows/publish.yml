name: Publish

on:
  push:
    branches:
      - main

# recommended: reset permissions and explicitly specify for each job
permissions: {}

# recommended: avoid concurrent runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  select-mode:
    name: Select Changesets mode
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    permissions:
      contents: read # to check out repo (actions/checkout)
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false # recommended: do not persist git credentials on disk

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: ./pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@v2

  version:
    name: Version packages
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: write # to commit version changes (changesets/action/version)
      pull-requests: write # to create the release pull request (changesets/action/version)
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false # recommended: do not persist git credentials on disk

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.x

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false # recommended: avoid cache poisoning

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Version packages
        uses: changesets/action/version@v2
        with:
          # Runs `changeset version` and syncs jsr.json via the package script
          script: pnpm run version
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"

  pack:
    name: Pack packages
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-latest
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    permissions:
      contents: read # to check out repo (actions/checkout)
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false # recommended: do not persist git credentials on disk

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.x

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false # recommended: avoid cache poisoning

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `changeset pack` runs `pnpm pack`, which executes the `prepack` script to build dist/
      - name: Pack packages
        id: pack
        uses: changesets/action/pack@v2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    name: Publish packages
    needs: pack
    runs-on: ubuntu-latest
    environment:
      name: neuro-game-api
      url: https://npmx.dev/package/neuro-game-api
    permissions:
      contents: write # to create releases and push git tags (changesets/action/publish)
      id-token: write # for npm trusted publishing and JSR OIDC publishing
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false # recommended: do not persist git credentials on disk

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.x

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish to npm
        id: changesets
        uses: changesets/action/publish@v2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}

      # Publishing a pre-packed tarball skips npm lifecycle scripts, so JSR publishing runs explicitly here.
      - name: Publish to JSR
        if: steps.changesets.outputs.published == 'true'
        run: pnpm exec jsr publish
